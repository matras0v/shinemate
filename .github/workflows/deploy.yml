name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не даём двум деплоям идти одновременно, но не отменяем уже идущий —
# страница не должна остаться недособранной на середине.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA fallback for GitHub Pages
        # У GitHub Pages нет server-side rewrite для client-side роутинга.
        # 404.html — это index.html же: любой прямой переход на глубокий
        # роут (например /shinemate/catalog/plates) или refresh на нём
        # получает тот же HTML-шелл, который сам React-роутер разбирает по
        # location.pathname. .nojekyll отключает обработку Jekyll, которая
        # иначе могла бы тронуть папки, начинающиеся с "_" или ".".
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
