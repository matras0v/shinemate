<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Сайт на GitHub Pages с подключённым клиентским доменом — отдаётся
      с корня домена ("/"), а не из-под /shinemate/, как было раньше на
      голом matras0v.github.io/shinemate/. <base> — единственный
      источник истины для этого пути: все относительные href/src/srcSet
      ниже и во всём приложении резолвятся через него. %BASE_URL%
      подставляется Vite-ом — теперь "/" и в dev, и в production (см.
      vite.config.ts). Должен идти как можно раньше в <head>, до первой
      ссылки, которую он должен затронуть.
    -->
    <base href="%BASE_URL%" />
    <title>ShineMate Россия — официальный дистрибьютор оборудования для полировки</title>
    <meta
      name="description"
      content="ShineMate Россия — полировальное оборудование: роторные и эксцентриковые машинки, круги и пасты для детейлинга. Официальный дистрибьютор ShineMate в России."
    />
    <meta name="theme-color" content="#F7F6F2" />
    <!--
      favicon.ico — часть краулеров и старых браузеров запрашивают именно
      этот путь напрямую по умолчанию, игнорируя <link rel="icon"> ниже
      (это и есть причина, по которой Google в поиске показывал общий
      значок-globus вместо логотипа: .ico на сайте не было вовсе).
    -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="brand/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <!--
      Статический фолбэк на главную — App.tsx (setCanonical) переписывает
      href этого же тега на каждый маршрут сразу после монтирования, но
      до первого рендера React здесь должно быть хоть что-то валидное.
    -->
    <link rel="canonical" href="https://shinemate-russia.ru/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="ShineMate Россия" />
    <meta property="og:title" content="ShineMate Россия — официальный дистрибьютор оборудования для полировки" />
    <meta
      property="og:description"
      content="Роторные и эксцентриковые полировальные машинки, круги и пасты ShineMate. Официальный дистрибьютор ShineMate в России."
    />
    <!--
      Абсолютный URL: OG-краулеры не всегда учитывают <base> или
      относительные пути. ВАЖНО: OG-теги здесь общие на весь сайт, а не
      по разделу — мессенджеры/соцсети не выполняют JS и видят только
      этот статичный HTML, поэтому честный per-page OG потребовал бы
      серверного рендеринга, которого у сайта (чистый SPA) нет. Ссылка
      всегда ведёт на главную независимо от того, с какой страницы
      сайта её расшарили.
    -->
    <meta property="og:url" content="https://shinemate-russia.ru/" />
    <meta property="og:image" content="https://shinemate-russia.ru/media/hero-1280.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Organization + WebSite — верны на любой странице сайта, поэтому
      статичные, в отличие от BreadcrumbList/Product ниже (те собирает
      React в App.tsx под конкретный маршрут — Google их дорендеривает
      через JS, см. комментарий у setCanonical).
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ShineMate Россия",
        "alternateName": ["ShineMate", "ShineMate Russia", "Шайнмате", "Шайнмейт"],
        "url": "https://shinemate-russia.ru/",
        "logo": "https://shinemate-russia.ru/brand/logo-shinemate.webp",
        "description": "Официальный дистрибьютор ShineMate в России."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ShineMate Россия",
        "alternateName": ["ShineMate", "ShineMate Russia", "Шайнмате", "Шайнмейт"],
        "url": "https://shinemate-russia.ru/",
        "inLanguage": "ru"
      }
    </script>

    <!--
      Шрифты — локальные копии Google Fonts (public/fonts/), а не запрос к
      fonts.googleapis.com на каждой загрузке страницы. Обращение к Google
      с браузера посетителя передаёт его IP на серверы Google — по 152-ФЗ
      это лишняя точка передачи персональных данных за пределы сайта,
      которую юристы прямо просят убрать. Файлы и веса те же (Inter Tight,
      JetBrains Mono), просто раздаются с этого же домена.
    -->
    <!--
      Кириллица и латиница у Inter Tight лежат в РАЗНЫХ файлах (Google режет
      шрифт по unicode-range). Пока один сабсет ещё едет, а второй уже
      пришёл, строка вида «О ShineMate» рендерится двумя гарнитурами сразу —
      часть букв заметно толще или уже соседних. Клиент видел это как
      «шрифт слетел, буквы u и o выделяются».

      Веса 400/500/600 берут один и тот же файл на сабсет, поэтому достаточно
      предзагрузить ровно два: f0 — кириллица, f2 — латиница. Оба приходят до
      первой отрисовки, и смешения гарнитур не возникает.
    -->
    <link rel="preload" href="fonts/f0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/f2.woff2" as="font" type="font/woff2" crossorigin />
    <link href="fonts.css" rel="stylesheet" />
    <script>
      // Кадр hero предзагружается только на главной: в каталоге он не нужен,
      // и браузер справедливо ругался на неиспользованный preload. Сравнение
      // идёт с базовым путём (а не буквально с "/"), иначе на GitHub Pages
      // (где путь на главной — "/shinemate/", а не "/") условие никогда не
      // выполнялось бы и хайрес-кадр не предзагружался бы вовсе.
      var BASE = '%BASE_URL%'
      if (location.pathname === BASE) {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = 'media/hero-1920.webp'
        // Атрибуты, а не свойства: иначе браузер предзагружает href-кандидата,
        // а разметка выбирает другой файл из srcset — и preload пропадает зря.
        l.setAttribute(
          'imagesrcset',
          'media/hero-800.webp 800w, media/hero-1280.webp 1280w, media/hero-1920.webp 1920w'
        )
        l.setAttribute('imagesizes', '(min-width: 1024px) 56vw, 100vw')
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
